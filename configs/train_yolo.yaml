# train_yolo.yaml
# Hydra root config for YOLO semantic segmentation on UAVid
#
# Usage (train):
#   python src/scripts/train_yolo.py
#   python src/scripts/train_yolo.py 'yolo/model@model=yolov8l-seg'
#   python src/scripts/train_yolo.py 'yolo/model@model=yolo11m-seg'
#
# Usage (validate best checkpoint):
#   python src/scripts/train_yolo.py mode=val \
#       validation_config.weights=runs/uavid_yolo/yolov8m/weights/best.pt
#
# Resume interrupted training:
#   python src/scripts/train_yolo.py training_config.resume=true
#
# Multi-GPU:
#   python src/scripts/train_yolo.py runtime.device="0,1"

defaults:
  - _self_
  - yolo/model@model: yolov8m-seg   # override: 'yolo/model@model=yolo11x-seg'

# Mode: train | val
mode: train

# Path to the Ultralytics-format dataset YAML (not Hydra-format)
dataset:
  name: uavid_yolo
  config_file: configs/dataset/uavid_yolo.yaml

# ── Training configuration ────────────────────────────────────────────────────
training_config:
  epochs: 120
  batch_size: 4
  imgsz: 1024
  num_workers: 8

  # Gradient accumulation: effective_batch = nbs; accum_steps = nbs / (batch * num_gpus)
  # With batch=4 and nbs=64: 16 micro-batches per optimizer step (matches CABiNet baseline)
  nbs: 64

  # Mixed precision — wraps torch.cuda.amp.autocast internally
  # EMA (exponential moving average) is always active; best.pt contains EMA weights
  amp: true

  # Optimizer
  optimizer: SGD
  optimizer_lr_start: 0.01
  lrf: 0.01                  # final LR = lr0 * lrf (cosine floor)
  optimizer_momentum: 0.937
  optimizer_weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true

  # Early stopping (epochs without val mIoU improvement)
  patience: 30

  # Checkpointing
  save_period: 10            # save extra checkpoint every N epochs (-1 = disable)
  resume: false              # set true to resume from last.pt in the run directory

  # Semantic segmentation — overlap_mask MUST be false
  overlap_mask: false
  mask_ratio: 1              # no mask downsampling (full resolution)

  # Class imbalance (UAVid: Human/MovingCar are rare)
  # 0.0 = disabled (uniform), 1.0 = full inverse-frequency weighting
  cls_pw: 0.5

  experiments_path: runs/uavid_yolo
  exist_ok: false

  # ── Augmentation ───────────────────────────────────────────────────────────
  # UAVid is aerial orthographic imagery — parameters tuned accordingly
  augmentation:
    # Geometric
    degrees: 10.0            # rotation ±10° (matches CABiNet RandomRotate)
    translate: 0.05          # small translation
    scale: 0.3               # scale jitter ±30%
    shear: 0.0               # disabled (ortho view)
    perspective: 0.0         # disabled (no perspective distortion)
    flipud: 0.2              # vertical flip valid for top-down aerial view
    fliplr: 0.5              # horizontal flip

    # Photometric
    hsv_h: 0.01              # small hue shift (controlled imaging conditions)
    hsv_s: 0.4               # saturation jitter
    hsv_v: 0.3               # brightness jitter

    # Mosaic / mixup — helps for small objects (Human, MovingCar)
    mosaic: 0.8
    mixup: 0.1
    copy_paste: 0.15
    copy_paste_mode: flip

    # Close mosaic before final epochs to stabilise boundary predictions
    close_mosaic: 15

    # Multi-scale training (0.0 = disabled; 0.2 = ±20% size range)
    multi_scale: 0.0

# ── Validation configuration ─────────────────────────────────────────────────
validation_config:
  batch_size: 1              # 1 for full-resolution eval
  overlap_mask: false        # must match training setting
  save_json: true
  augment: false             # TTA: set true on CLI for augmented eval
  weights: ~                 # null → auto-inferred from experiments_path/model.run_name

# ── Runtime ──────────────────────────────────────────────────────────────────
runtime:
  seed: 0
  device: 0                  # GPU id; 'cpu' for CPU-only, '0,1' for multi-GPU DDP
  deterministic: true

# ── Hydra output ─────────────────────────────────────────────────────────────
hydra:
  run:
    dir: ${training_config.experiments_path}/hydra/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${training_config.experiments_path}/sweeps
    subdir: ${hydra.job.num}
