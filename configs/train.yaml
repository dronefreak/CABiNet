# train_citys.yaml
# Hydra-based configuration for CABiNet training on Cityscapes

defaults: # these are the sub-config files for specific details, noee for the moment.
  - _self_ # this makes the top-level config take priority over sub-configs, see https://hydra.cc/docs/upgrades/1.0_to_1.1/default_composition_order/
  - model: mobilenetv3_large
  - dataset: cityscapes

# Training Configuration
training_config:
  batch_size: 8
  num_workers: 16
  epochs: 200
  accum_steps: 1 # Simulate batch size * accum_steps
  optimizer_momentum: 0.9
  optimizer_weight_decay: 5e-4
  optimizer_lr_start: 5e-3
  optimizer_power: 0.9
  warmup_steps: 4000
  warmup_start_lr: 1e-5
  # max_iterations is in OPTIMIZER STEPS (not batches).
  # train.py computes this as ceil(epochs * batches_per_epoch / accum_steps).
  # Setting it here is optional — if absent, train.py derives it automatically.
  # If set, it overrides the derived value (useful for multi-phase schedules).
  max_iterations: ~ # null → auto-computed from epochs/accum_steps

  # Class imbalance (UAVid: Human/MovingCar are rare). Weights are computed
  # at startup from a sample of the training set via the ENet inverse-log
  # formula (1 / ln(1.02 + p)) ** cls_pw — same formula and semantics as the
  # YOLO26 pipeline's cls_pw (configs/train_yolo.yaml), so both pipelines
  # respond to this knob the same way.
  # 0.0 = disabled (uniform), 1.0 = full inverse-frequency weighting
  cls_pw: 0.5

  max_grad_norm: 1.0 # Gradient clipping threshold; set to null/0 to disable
  log_iter: 20 # Renamed from 'msg_iterations' — clearer intent
  experiments_path: experiments/cabinet_experiments_large_1024x1024
  model_save_name: cabinet.pth
  resume: false # Set to true to resume from checkpoint_last.pth in experiments_path

  # Exponential moving average of model weights. best/final .pth files and the
  # per-epoch mIoU eval all use the EMA model, not the raw training weights
  # (matches the YOLO26 pipeline's "best.pt/last.pt are EMA-averaged" convention).
  ema_decay: 0.9999 # target decay; ramps up from ~0 over the first ema_tau updates
  ema_tau: 2000 # decay ramp time constant, in optimizer steps

  # Early stopping on mIoU (evaluated on EMA weights). 0 = disabled.
  patience: 30

# Validation Configuration
validation_config:
  batch_size: 1
  num_workers: 8 # Explicitly set (can be lower than training)
  eval_scales: [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]
  flip: true
  eval_every_n_epochs: 1 # Run per-epoch mIoU eval every N epochs (1=every epoch)
  results_path: ${training_config.experiments_path}/results # Consistent output location
  save_predictions: false # Optional: save .png preds during eval

# Runtime & Reproducibility
runtime:
  seed: 15 # For torch.manual_seed, numpy, random
  cudnn_benchmark: true # Faster convolutions (if input size stable)
  deterministic: false # Set to true for full reproducibility (slower)

# Hydra-specific settings
hydra:
  run:
    dir: ${training_config.experiments_path}/runs/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${training_config.experiments_path}/sweeps
    subdir: ${hydra.job.num}
